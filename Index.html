```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 장소 검색</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 전체 화면 2분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 영역 */
    .sidebar {
      width: 35%;
      min-width: 320px;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
      background-color: #f9f9f9;
    }

    /* 검색 영역 */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .search-box button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background-color: #ffcd00;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box button:hover {
      background-color: #f5c400;
    }

    /* 검색 결과 리스트 */
    .result-list {
      list-style: none;
    }

    .result-item {
      padding: 15px;
      margin-bottom: 12px;
      background-color: white;
      border-radius: 10px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: 0.2s;
    }

    .result-item:hover {
      background-color: #fff8d9;
    }

    .place-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .place-address {
      color: #555;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .place-phone {
      color: #888;
      font-size: 13px;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      height: 100vh;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 40%;
      }

      #map {
        height: 60%;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 왼쪽 검색 영역 -->
    <div class="sidebar">

      <div class="search-box">
        <input type="text" id="keyword" placeholder="장소를 검색하세요" />
        <button onclick="searchPlaces()">검색</button>
      </div>

      <ul id="resultList" class="result-list"></ul>

    </div>

    <!-- 오른쪽 지도 -->
    <div id="map"></div>

  </div>

  <!-- 카카오맵 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7b2fd2eeba963b3ceecbbdefbcff7361&libraries=services&autoload=false"></script>

  <script>
    let map;
    let placesService;
    let markers = [];

    // 현재 위치 마커
    let currentMarker = null;

    // 지도 초기화 함수
    function initializeMap(latitude, longitude) {

      // 현재 위치 좌표
      const currentPosition = new kakao.maps.LatLng(latitude, longitude);

      // 지도 생성 옵션
      const mapOption = {
        center: currentPosition,
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(document.getElementById("map"), mapOption);

      // 장소 검색 서비스 생성
      placesService = new kakao.maps.services.Places();

      // 현재 위치 마커 표시
      currentMarker = new kakao.maps.Marker({
        position: currentPosition,
        map: map
      });

      // 현재 위치 인포윈도우
      const infoWindow = new kakao.maps.InfoWindow({
        content: "<div style='padding:6px;'>현재 위치</div>"
      });

      infoWindow.open(map, currentMarker);
    }

    // 장소 검색 함수
    function searchPlaces() {

      const keyword = document.getElementById("keyword").value.trim();

      // 검색어가 없으면 종료
      if (!keyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      // 키워드 검색 실행
      placesService.keywordSearch(keyword, placesSearchCB, {
        location: map.getCenter()
      });
    }

    // 검색 결과 콜백 함수
    function placesSearchCB(data, status) {

      // 검색 성공 여부 확인
      if (status !== kakao.maps.services.Status.OK) {
        alert("검색 결과가 없습니다.");
        return;
      }

      // 기존 마커 제거
      removeMarkers();

      // 결과 리스트 영역
      const resultList = document.getElementById("resultList");

      // 기존 리스트 초기화
      resultList.innerHTML = "";

      // 지도 범위 재설정용 객체
      const bounds = new kakao.maps.LatLngBounds();

      // 검색 결과 반복
      data.forEach((place) => {

        const position = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        markers.push(marker);

        // 지도 범위 추가
        bounds.extend(position);

        // 리스트 아이템 생성
        const item = document.createElement("li");
        item.className = "result-item";

        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-address">${place.address_name}</div>
          <div class="place-phone">${place.phone || "전화번호 없음"}</div>
        `;

        // 리스트 클릭 시 지도 이동
        item.addEventListener("click", () => {
          map.setCenter(position);

          const infoWindow = new kakao.maps.InfoWindow({
            content: `
              <div style="padding:8px; font-size:13px;">
                ${place.place_name}
              </div>
            `
          });

          infoWindow.open(map, marker);
        });

        resultList.appendChild(item);
      });

      // 검색 결과가 모두 보이도록 지도 범위 설정
      map.setBounds(bounds);
    }

    // 기존 마커 제거 함수
    function removeMarkers() {
      markers.forEach((marker) => marker.setMap(null));
      markers = [];
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {

      // 위치 정보 지원 여부 확인
      if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

          // 위치 정보 성공
          (position) => {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            initializeMap(latitude, longitude);
          },

          // 위치 정보 실패
          () => {

            // 기본 위치 (서울시청)
            initializeMap(37.5665, 126.9780);

            alert("위치 권한이 거부되어 기본 위치로 설정됩니다.");
          }
        );

      } else {

        // 브라우저가 위치 정보를 지원하지 않을 경우
        initializeMap(37.5665, 126.9780);

        alert("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
      }
    }

    // 카카오맵 API 로드 완료 후 실행
    kakao.maps.load(() => {
      getCurrentLocation();
    });

    // 엔터키 검색 지원
    document.addEventListener("DOMContentLoaded", () => {

      const keywordInput = document.getElementById("keyword");

      keywordInput.addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
          searchPlaces();
        }

      });

    });
  </script>

</body>
</html>
